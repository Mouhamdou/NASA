<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscription</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eef2f8;
        --surface: #ffffff;
        --surface-alt: #f7f9fc;
        --text: #12223f;
        --muted: #5d6b85;
        --primary: #3867ff;
        --border: rgba(37, 80, 210, 0.15);
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f4f7fd 0%, #e8eef7 100%);
        color: var(--text);
        padding: 24px;
      }

      .container {
        width: min(640px, 100%);
        background: var(--surface);
        border-radius: 28px;
        box-shadow: 0 30px 60px rgba(17, 42, 86, 0.09);
        overflow: hidden;
        border: 1px solid var(--border);
      }

      .hero {
        padding: 36px 44px 24px;
        background: linear-gradient(
          135deg,
          rgba(56, 103, 255, 0.1),
          rgba(72, 178, 255, 0.08)
        );
        text-align: center;
      }

      .hero h1 {
        margin: 0;
        font-size: clamp(1.8rem, 2.5vw, 2.4rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .hero p {
        margin: 12px auto 0;
        max-width: 520px;
        color: var(--muted);
        line-height: 1.75;
      }

      form {
        display: grid;
        gap: 20px;
        padding: 32px 44px 44px;
      }

      .row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 0.95rem;
        color: var(--muted);
      }

      input,
      select {
        width: 100%;
        padding: 14px 16px;
        border-radius: 16px;
        border: 1px solid rgba(33, 71, 161, 0.12);
        background: #f9fbff;
        color: var(--text);
        font-size: 1rem;
        outline: none;
        transition:
          border-color 160ms ease,
          transform 160ms ease,
          box-shadow 160ms ease;
      }

      input:focus,
      select:focus {
        border-color: rgba(56, 103, 255, 0.45);
        box-shadow: 0 0 0 4px rgba(56, 103, 255, 0.12);
        transform: translateY(-1px);
      }

      .full-width {
        grid-column: 1 / -1;
      }

      button {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 16px;
        background: var(--primary);
        color: #ffffff;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition:
          background 180ms ease,
          transform 180ms ease,
          box-shadow 180ms ease;
        box-shadow: 0 16px 28px rgba(56, 103, 255, 0.18);
      }

      button:hover {
        background: #264dd9;
        transform: translateY(-2px);
        box-shadow: 0 20px 35px rgba(56, 103, 255, 0.22);
      }

      @media (max-width: 700px) {
        .hero {
          padding: 28px 24px 20px;
        }

        form {
          padding: 28px 24px 32px;
        }

        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <section class="container">
      <div class="hero">
        <h1>Inscription</h1>
        <p>
          Complétez le formulaire pour créer un compte. La présentation est
          fluide, centrée et adaptée aux écrans mobiles comme aux ordinateurs.
        </p>
      </div>
      <form id="inscriptionForm">
        <div class="row">
          <div class="field">
            <label for="prenom">Prénom</label>
            <input
              type="text"
              id="prenom"
              name="prenom"
              placeholder="Votre prénom"
              required
            />
          </div>
          <div class="field">
            <label for="nom">Nom</label>
            <input
              type="text"
              id="nom"
              name="nom"
              placeholder="Votre nom"
              required
            />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="exemple@domaine.com"
              required
            />
          </div>
          <div class="field">
            <label for="password">Mot de passe</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              required
            />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="profil">Profil</label>
            <select id="profil" name="profil" required>
              <option value="">Choisir un profil</option>
              <option value="etudiant">Étudiant</option>
              <option value="professionnel">Professionnel</option>
              <option value="visiteur">Visiteur</option>
            </select>
          </div>
          <div class="field">
            <label for="sexe">Sexe</label>
            <select id="sexe" name="sexe" required>
              <option value="">Choisir</option>
              <option value="homme">Homme</option>
              <option value="femme">Femme</option>
            </select>
          </div>
        </div>

        <div class="field full-width">
          <label for="nationalite">Nationalité</label>
          <select id="nationalite" name="nationalite" required>
            <option value="">Sélectionnez une nationalité</option>
            <option value="france">France</option>
            <option value="belgique">Belgique</option>
            <option value="suisse">Suisse</option>
            <option value="canada">Canada</option>
            <option value="maroc">Maroc</option>
            <option value="senegal">Sénégal</option>
            <option value="tunisie">Tunisie</option>
            <option value="royaume-uni">Royaume-Uni</option>
            <option value="etats-unis">États-Unis</option>
            <option value="autre">Autre</option>
          </select>
        </div>

        <button type="submit">Enregistrer</button>
      </form>
    </section>

    <script>
      document
        .getElementById("inscriptionForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();
          window.location.href = "welcome.html";
        });
    </script>
  </body>
</html>
